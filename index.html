<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15120e">
<title>Roslindale Transit Board</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#15120e;color:#eee5cc;font-family:Georgia,"Times New Roman",serif;padding:14px}
.board{height:100%;border:3px solid #393126;background:#1b1813;box-shadow:inset 0 0 35px #000;display:flex;flex-direction:column}
.header{height:12%;display:flex;align-items:center;justify-content:space-between;padding:0 2.2%;border-bottom:4px solid #393126}
.brand{font-size:clamp(24px,3.1vw,48px);letter-spacing:.16em;font-weight:bold}
.clock{font-family:monospace;font-size:clamp(24px,3vw,44px);letter-spacing:.05em}
.section{flex:1;min-height:0;border-bottom:3px solid #393126;display:flex;flex-direction:column}
.section:last-of-type{border-bottom:0}
.section-title{height:24%;display:flex;align-items:center;padding:0 2.2%;font-size:clamp(18px,2.1vw,31px);letter-spacing:.08em;font-weight:bold}
.rows{height:76%;display:grid;grid-template-columns:repeat(3,1fr);gap:0 1.3%;padding:0 1.2% 1.2%}
.tileRow{display:grid;grid-template-columns:1.05fr .75fr 1.65fr 1fr;gap:5px;align-items:stretch;min-width:0}
.tile{background:#090909;border:1px solid #3a3730;display:flex;align-items:center;justify-content:center;
font-family:Impact,"Arial Narrow",monospace;font-size:clamp(18px,2vw,32px);letter-spacing:.04em;
box-shadow:inset 0 -2px 0 #000,inset 0 2px 0 #282828;min-width:0;overflow:hidden}
.tile.small{font-size:clamp(14px,1.35vw,23px)} .tile.time{font-size:clamp(20px,2.25vw,36px)}
.tile.leave{font-size:clamp(14px,1.5vw,24px)}
.tile span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 5px}
.label{background:#28231b;border:0;color:#a99f89;font-family:monospace;font-size:clamp(9px,0.8vw,13px)}
.flip{animation:flip .55s ease both}
@keyframes flip{0%{transform:perspective(400px) rotateX(0);filter:brightness(1)}
50%{transform:perspective(400px) rotateX(-90deg);filter:brightness(.45)}
100%{transform:perspective(400px) rotateX(0);filter:brightness(1)}}
.footer{height:5%;display:flex;align-items:center;justify-content:space-between;padding:0 2%;font-family:monospace;font-size:11px;color:#756d5e}
.empty{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:#756d5e;font-family:monospace}
@media(max-width:900px){
 body{padding:6px}.brand{font-size:22px}.clock{font-size:22px}
 .section-title{height:18%;font-size:17px}.rows{height:82%;grid-template-columns:1fr}
 .section{overflow:hidden}.tileRow{min-height:42px}.tile{font-size:18px}.tile.small{font-size:13px}.tile.leave{font-size:13px}
}
</style>
</head>
<body>
<div class="board">
  <header class="header"><div class="brand">ROSLINDALE TRANSIT</div><div id="clock" class="clock">--:--</div></header>
  <section class="section" id="wash"><div class="section-title">WASHINGTON ST @ CUMMINS HWY — FOREST HILLS</div><div class="rows"></div></section>
  <section class="section" id="pen"><div class="section-title">PENFIELD ST — FOREST HILLS</div><div class="rows"></div></section>
  <section class="section" id="rail"><div class="section-title">ROSLINDALE VILLAGE — COMMUTER RAIL</div><div class="rows"></div></section>
  <footer class="footer"><span id="status">CONNECTING TO MBTA...</span><span>LIVE • UPDATES EVERY 20 SEC</span></footer>
</div>
<script>
const API="https://api-v3.mbta.com";
const API_KEY=""; // Optional
const CFG={
 wash:{name:"Washington St @ Cummins Hwy",walk:9,buffer:2},
 pen:{name:"Belgrade Ave @ Penfield St",walk:2,buffer:0}
};
const cache=new Map(), old=new Map();

async function get(path){
 const r=await fetch(API+path,{cache:"no-store",headers:API_KEY?{"x-api-key":API_KEY}:{}});
 if(!r.ok) throw Error("MBTA "+r.status);
 return r.json();
}
async function stopId(name){
 if(cache.has(name))return cache.get(name);
 // Use filter[name] with page[limit] and pick exact match.
 const j=await get("/stops?filter[name]="+encodeURIComponent(name)+"&page[limit]=50");
 const exact=(j.data||[]).find(x=>(x.attributes.name||"").toLowerCase()===name.toLowerCase());
 if(!exact) throw Error("Stop not found: "+name);
 cache.set(name,exact.id); return exact.id;
}
function mins(iso){return Math.max(0,Math.round((new Date(iso)-Date.now())/60000))}
function fmtTime(iso){return new Date(iso).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}
function clean(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

async function busPred(cfg){
 const sid=await stopId(cfg.name);
 const j=await get("/predictions?filter[stop]="+encodeURIComponent(sid)+"&include=route,trip&page[limit]=50");
 const inc=j.included||[];
 const route=id=>inc.find(x=>x.type==="route"&&x.id===id)?.attributes||{};
 const trip=id=>inc.find(x=>x.type==="trip"&&x.id===id)?.attributes||{};
 return (j.data||[]).map(p=>{
   const a=p.attributes||{}, r=route(p.relationships?.route?.data?.id), t=trip(p.relationships?.trip?.data?.id);
   const iso=a.departure_time||a.arrival_time, head=(t.headsign||"").toUpperCase();
   return {id:p.id,iso,route:r.short_name||r.long_name||"?",dest:t.headsign||r.long_name||"",head,mins:iso?mins(iso):null,walk:cfg.walk,buffer:cfg.buffer};
 }).filter(x=>x.iso&&x.mins!==null&&x.mins<=120&&/FOREST HILLS/i.test(x.head))
   .sort((a,b)=>new Date(a.iso)-new Date(b.iso));
}

async function railPred(){
 // Roslindale commuter rail stop; find by exact name, then predictions.
 const sid=await stopId("Roslindale");
 const j=await get("/predictions?filter[stop]="+encodeURIComponent(sid)+"&include=route,trip&page[limit]=50");
 const inc=j.included||[];
 const route=id=>inc.find(x=>x.type==="route"&&x.id===id)?.attributes||{};
 const trip=id=>inc.find(x=>x.type==="trip"&&x.id===id)?.attributes||{};
 return (j.data||[]).map(p=>{
   const a=p.attributes||{}, r=route(p.relationships?.route?.data?.id), t=trip(p.relationships?.trip?.data?.id);
   const iso=a.departure_time||a.arrival_time;
   return {id:p.id,iso,route:r.long_name||r.short_name||"COMMUTER RAIL",dest:t.headsign||r.long_name||"",mins:iso?mins(iso):null,walk:7,buffer:1};
 }).filter(x=>x.iso&&x.mins!==null&&x.mins<=180)
   .sort((a,b)=>new Date(a.iso)-new Date(b.iso));
}

function row(item,key){
 const leave=Math.max(0,item.mins-item.walk-item.buffer);
 const k=item.id+"|"+item.iso+"|"+item.dest;
 const changed=old.get(key)!==k; old.set(key,k);
 return `<div class="tileRow${changed?" flip":""}">
   <div class="tile time"><span>${fmtTime(item.iso)}</span></div>
   <div class="tile"><span>${clean(item.route)}</span></div>
   <div class="tile"><span>${clean(item.dest).toUpperCase()}</span></div>
   <div class="tile leave"><span>LEAVE IN ${leave===0?"NOW":leave+" MIN"}</span></div>
 </div>`;
}
function draw(id,items){
 const box=document.querySelector("#"+id+" .rows");
 box.innerHTML=items.length?items.slice(0,3).map((x,i)=>row(x,id+i)).join("")
   :'<div class="empty">NO UPCOMING DEPARTURES</div>';
}
async function refresh(){
 let good=0;
 try{draw("wash",await busPred(CFG.wash));good++}catch(e){console.error(e);draw("wash",[])}
 try{draw("pen",await busPred(CFG.pen));good++}catch(e){console.error(e);draw("pen",[])}
 try{draw("rail",await railPred());good++}catch(e){console.error(e);draw("rail",[])}
 document.getElementById("status").textContent=`MBTA LIVE DATA • ${good}/3 SECTIONS UPDATED • ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}`;
}
function clock(){document.getElementById("clock").textContent=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}
clock();setInterval(clock,1000);refresh();setInterval(refresh,20000);
</script>
</body>
</html>
