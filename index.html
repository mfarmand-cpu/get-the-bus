<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0a">
<title>Roslindale Transit</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 0%,#242321 0,#151514 38%,#090909 100%);
  color:#eee8d4;
  font-family:"Arial Narrow",Arial,sans-serif;
  padding:18px;
}
.board{
  width:100%;height:100%;
  border:1px solid #4b4942;
  background:#10100f;
  box-shadow:0 0 0 8px #161614, inset 0 0 45px #000;
  display:flex;flex-direction:column;
  overflow:hidden;
}
/* Header */
.header{
  flex:0 0 15%;
  display:grid;
  grid-template-columns:1fr 245px;
  align-items:center;
  border-bottom:1px solid #4a4943;
  background:linear-gradient(#161615,#0e0e0d);
  padding:8px 18px 8px 22px;
}
.brand{
  font-family:Impact,"Arial Narrow",sans-serif;
  font-size:clamp(30px,5vw,72px);
  font-weight:400;
  letter-spacing:.16em;
  color:#eee9d8;
  text-shadow:0 1px 0 #777,0 2px 2px #000;
  white-space:nowrap;
}
.clockbox{
  height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-left:1px solid #35342f;
}
.clocklabel{
  font-size:clamp(12px,1.2vw,18px);
  font-weight:700;letter-spacing:.22em;color:#ddd4b6;
  margin-bottom:6px;
}
.clock{
  font-family:Impact,"Arial Narrow",sans-serif;
  font-size:clamp(25px,3vw,48px);
  letter-spacing:.1em;color:#eee9d8;
  text-shadow:0 1px 0 #777,0 2px 2px #000;
}
/* Column headings */
.column-head{
  flex:0 0 6%;
  display:grid;
  grid-template-columns:1fr .72fr 2.65fr 2.25fr 1fr;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #3e3d38;
  color:#d9bd70;
  font-weight:700;
  letter-spacing:.18em;
  font-size:clamp(11px,1.35vw,19px);
}
.column-head div:nth-child(1),.column-head div:nth-child(2),.column-head div:nth-child(3){text-align:center}
.column-head div:nth-child(4){text-align:left;padding-left:8px}
.column-head div:nth-child(5){text-align:right;padding-right:8px}
/* Sections */
.section{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  border-bottom:1px solid #3d3c37;
  background:linear-gradient(#111110,#0b0b0a);
}
.section:last-of-type{border-bottom:0}
.section-title{
  flex:0 0 25%;
  display:flex;align-items:center;
  padding:0 22px;
  font-family:"Arial Narrow",Arial,sans-serif;
  font-weight:700;
  font-size:clamp(15px,2vw,28px);
  letter-spacing:.18em;
  color:#eee8d4;
  text-shadow:0 1px 2px #000;
}
.rows{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  gap:5px;
  padding:0 14px 7px;
}
.tileRow{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:1fr .72fr 2.65fr 2.25fr 1fr;
  gap:4px;
  align-items:stretch;
}
/* Split-flap cells */
.tile{
  position:relative;
  min-width:0;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  border:1px solid #262622;
  border-radius:2px;
  background:
    repeating-linear-gradient(to right,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 29px),
    linear-gradient(#151514,#090908 48%,#111110 52%,#080807);
  box-shadow:
    inset 0 1px 0 #30302c,
    inset 0 -1px 0 #000,
    0 1px 2px #000;
}
.tile::before{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(50% - 1px),rgba(0,0,0,.8) calc(50% - 1px),rgba(0,0,0,.8) calc(50% + 1px),transparent calc(50% + 1px),transparent 100%);
  pointer-events:none;
}
.tile::after{
  content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:#30302c;box-shadow:0 1px 1px #000;
  opacity:.9;pointer-events:none;
}
.tile span{
  position:relative;z-index:2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:0 7px;
  font-family:Impact,"Arial Narrow",sans-serif;
  font-size:clamp(14px,1.75vw,28px);
  font-weight:400;
  letter-spacing:.13em;
  color:#eee9d8;
  text-shadow:0 1px 0 #777,0 2px 2px #000;
}
.tile.due span{letter-spacing:.08em}
.tile.route span{letter-spacing:.12em}
.tile.stop span{
  font-size:clamp(11px,1.35vw,20px);
  letter-spacing:.13em;
}
.tile.leave span{
  font-size:clamp(12px,1.45vw,22px);
  color:#e4d7a9;
  letter-spacing:.1em;
}
.due-number{display:inline-block}
.due-min{font-size:.72em;letter-spacing:.16em;margin-left:5px}
.flip{animation:flip .55s ease both}
@keyframes flip{
  0%{transform:perspective(700px) rotateX(0);filter:brightness(1)}
  42%{transform:perspective(700px) rotateX(-88deg);filter:brightness(.35)}
  100%{transform:perspective(700px) rotateX(0);filter:brightness(1)}
}
.empty{
  flex:1;display:flex;align-items:center;justify-content:center;
  color:#625e53;font-family:monospace;font-size:14px;letter-spacing:.14em;
}
.footer{
  flex:0 0 5%;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  color:#6d685d;
  font-family:monospace;font-size:clamp(8px,.8vw,12px);
  letter-spacing:.12em;
}
@media(max-width:900px){
  body{padding:8px}
  .header{grid-template-columns:1fr 165px;padding:5px 12px}
  .brand{font-size:27px;letter-spacing:.11em}
  .clocklabel{font-size:10px}.clock{font-size:24px}
  .column-head{padding:0 8px;font-size:10px;letter-spacing:.11em}
  .section-title{padding:0 12px;font-size:15px;letter-spacing:.12em}
  .rows{padding:0 8px 5px;gap:3px}
  .tileRow{gap:3px}
  .tile span{font-size:15px;letter-spacing:.08em}
  .tile.stop span{font-size:10px}.tile.leave span{font-size:10px}
}
</style>
</head>
<body>
<div class="board">
  <header class="header">
    <div class="brand">ROSLINDALE TRANSIT</div>
    <div class="clockbox">
      <div class="clocklabel">LOCAL TIME</div>
      <div id="clock" class="clock">--:--</div>
    </div>
  </header>

  <div class="column-head">
    <div>DUE</div><div>ROUTE</div><div>DESTINATION</div><div>STOP</div><div>LEAVE IN</div>
  </div>

  <section class="section" id="wash">
    <div class="section-title">WASHINGTON STREET</div>
    <div class="rows"></div>
  </section>

  <section class="section" id="pen">
    <div class="section-title">PENFIELD</div>
    <div class="rows"></div>
  </section>

  <section class="section" id="rail">
    <div class="section-title">ROSLINDALE VILLAGE (COMMUTER RAIL)</div>
    <div class="rows"></div>
  </section>

  <footer class="footer">
    <span id="status">CONNECTING TO MBTA...</span>
    <span>UPDATES EVERY 20 SECONDS</span>
  </footer>
</div>

<script>
const API="https://api-v3.mbta.com";
const API_KEY="";

const WALK={
  wash:{minutes:9,buffer:2},
  pen:{minutes:2,buffer:0},
  rail:{minutes:7,buffer:1}
};

const WASHINGTON_STOP="636";
const oldRows=new Map();
const stopCache=new Map();

async function api(path){
  const r=await fetch(API+path,{cache:"no-store",headers:API_KEY?{"x-api-key":API_KEY}:{}});
  if(!r.ok) throw new Error("MBTA "+r.status);
  return r.json();
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function minutesUntil(iso){return Math.max(0,Math.round((new Date(iso)-Date.now())/60000));}
function timeText(iso){return new Date(iso).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});}

async function findStopsForRoute(routeId){
  const results=[];
  for(const dir of [0,1]){
    try{
      const j=await api("/stops?filter[route]="+encodeURIComponent(routeId)+"&filter[direction_id]="+dir+"&page[limit]=200");
      for(const s of (j.data||[])) results.push({id:s.id,name:s.attributes?.name||"",direction:dir});
    }catch(e){console.warn("route stop lookup failed",routeId,dir,e);}
  }
  return results;
}
async function findPenfieldStops(){
  if(stopCache.has("penfield")) return stopCache.get("penfield");
  const found=new Map();
  for(const route of ["35","36","37"]){
    for(const s of await findStopsForRoute(route)){
      if((s.name||"").toLowerCase().includes("penfield")) found.set(s.id,{...s,route});
    }
  }
  const answer=[...found.values()];
  stopCache.set("penfield",answer);
  return answer;
}
async function findRoslindaleRailStops(){
  if(stopCache.has("rail")) return stopCache.get("rail");
  const found=[];
  for(const dir of [0,1]){
    try{
      const j=await api("/stops?filter[route]=CR-Needham&filter[direction_id]="+dir+"&page[limit]=200");
      for(const s of (j.data||[])) if((s.attributes?.name||"").toLowerCase().includes("roslindale")) found.push({id:s.id,name:s.attributes?.name||"",direction:dir});
    }catch(e){console.warn("rail stop lookup failed",dir,e);}
  }
  const unique=[...new Map(found.map(x=>[x.id,x])).values()];
  stopCache.set("rail",unique);
  return unique;
}

async function predictions(stopIds){
  if(!stopIds.length) return [];
  const path="/predictions?filter[stop]="+encodeURIComponent(stopIds.join(","))+"&include=route,trip,stop&sort=departure_time&page[limit]=100";
  const j=await api(path);
  const included=j.included||[];
  const by=(type,id)=>included.find(x=>x.type===type&&x.id===id)?.attributes||{};
  return (j.data||[]).map(p=>{
    const a=p.attributes||{};
    const route=by("route",p.relationships?.route?.data?.id);
    const trip=by("trip",p.relationships?.trip?.data?.id);
    const stop=by("stop",p.relationships?.stop?.data?.id);
    const iso=a.departure_time||a.arrival_time;
    return {
      id:p.id,iso,mins:iso?minutesUntil(iso):null,
      route:route.short_name||route.long_name||"?",
      routeLong:route.long_name||"",
      dest:trip.headsign||"",
      stop:stop.name||"",
      direction:a.direction_id
    };
  }).filter(x=>x.iso&&x.mins!==null&&new Date(x.iso)>=new Date(Date.now()-30000));
}
async function getForestHillsBuses(stopIds){
  return (await predictions(stopIds))
    .filter(x=>/forest hills/i.test(x.dest||""))
    .sort((a,b)=>new Date(a.iso)-new Date(b.iso));
}
async function getRail(){
  const stops=await findRoslindaleRailStops();
  return (await predictions(stops.map(x=>x.id))).sort((a,b)=>new Date(a.iso)-new Date(b.iso));
}

function makeRow(item,key,walk){
  const leave=Math.max(0,item.mins-walk.minutes-walk.buffer);
  const signature=item.id+"|"+item.iso+"|"+item.dest+"|"+item.stop;
  const changed=oldRows.get(key)!==signature;
  oldRows.set(key,signature);
  const due=item.mins===0?"NOW":`<span class="due-number">${item.mins}</span><span class="due-min">MIN</span>`;
  const destination=(item.dest||item.routeLong||"").toUpperCase();
  return `<div class="tileRow${changed?" flip":""}">
    <div class="tile due"><span>${due}</span></div>
    <div class="tile route"><span>${esc(item.route)}</span></div>
    <div class="tile"><span>${esc(destination)}</span></div>
    <div class="tile stop"><span>${esc((item.stop||"").toUpperCase())}</span></div>
    <div class="tile leave"><span>${leave===0?"NOW":leave+" MIN"}</span></div>
  </div>`;
}
function draw(id,items,walk){
  const rows=document.querySelector("#"+id+" .rows");
  if(!items.length){rows.innerHTML='<div class="empty">NO UPCOMING DEPARTURES</div>';return;}
  rows.innerHTML=items.slice(0,3).map((x,i)=>makeRow(x,id+"-"+i,walk)).join("");
}
async function refresh(){
  let good=0;
  try{draw("wash",await getForestHillsBuses([WASHINGTON_STOP]),WALK.wash);good++;}catch(e){console.error("Washington",e);draw("wash",[],WALK.wash);}
  try{const s=await findPenfieldStops();draw("pen",await getForestHillsBuses(s.map(x=>x.id)),WALK.pen);good++;}catch(e){console.error("Penfield",e);draw("pen",[],WALK.pen);}
  try{draw("rail",await getRail(),WALK.rail);good++;}catch(e){console.error("Rail",e);draw("rail",[],WALK.rail);}
  document.getElementById("status").textContent=`MBTA REAL-TIME DEPARTURES • ${good}/3 SECTIONS UPDATED`;
}
function clock(){document.getElementById("clock").textContent=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});}
clock();setInterval(clock,1000);refresh();setInterval(refresh,20000);
</script>
</body>
</html>
